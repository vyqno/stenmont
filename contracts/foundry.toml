[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
remappings = [
  "forge-std/=dependencies/forge-std-1.17.0/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
]
solc = "0.8.38"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[dependencies]
forge-std = "1"
"@openzeppelin-contracts" = "5.6.1"

[soldeer]
remappings_generate = false
