[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
remappings = [
  "forge-std/=dependencies/forge-std-1.17.0/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
]
solc = "0.8.38"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
no_match_path = "test/fork/*"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.fork]
no_match_path = "test/unused/*"
match_path = "test/fork/*"

[dependencies]
forge-std = "1"
"@openzeppelin-contracts" = "5.6.1"

[soldeer]
remappings_generate = false

[fmt]
line_length = 120
bracket_spacing = false
number_underscore = "thousands"
sort_imports = true
